<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>THE WAR ROOM | DOPAMINE CLUB</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;700&family=Space+Grotesk:wght@700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="/js/shared_layout.js"></script>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen overflow-x-hidden selection:bg-error selection:text-on-error">

<header class="sticky top-md z-50 flex justify-between items-center px-md py-sm rounded-full border-2 border-error mt-md mx-auto w-[95%] max-w-[1600px] bg-error/10 backdrop-blur-xl shadow-[0_0_15px_rgba(255,75,137,0.3)] transition-all duration-300">
<div class="font-headline-lg text-headline-lg-mobile italic uppercase tracking-tighter text-error cursor-pointer" onclick="window.location.href='/'">
    WAR ROOM [ADMIN]
</div>
<nav class="hidden md:flex gap-md items-center">
    <button onclick="showTab('products-tab')" class="font-label-bold text-label-bold text-on-surface hover:text-error transition-transform tab-btn" data-target="products-tab">DROPS INVENTORY</button>
    <button onclick="showTab('orders-tab')" class="font-label-bold text-label-bold text-on-surface hover:text-error transition-transform tab-btn" data-target="orders-tab">TRANSACTIONS</button>
    <button onclick="showTab('users-tab')" class="font-label-bold text-label-bold text-on-surface hover:text-error transition-transform tab-btn" data-target="users-tab">USER DATABASE</button>
</nav>
<div class="flex items-center gap-sm">
    <button onclick="window.location.href='/profile.html'" class="bg-surface-container-highest text-on-surface font-label-bold text-label-bold px-md py-xs rounded-full border-border-width border-surface-variant hover:border-error transition-all active:scale-95">EXIT</button>
</div>
</header>

<main class="py-xl px-md max-w-[1600px] mx-auto relative">
    
    <!-- Tab: Products -->
    <section id="products-tab" class="tab-content">
        <div class="flex justify-between items-center mb-md border-b-2 border-surface-container-highest pb-md">
            <div>
                <h1 class="font-display-xl text-[48px] uppercase tracking-tighter text-error leading-none">DROP INVENTORY</h1>
                <p class="font-label-bold text-on-surface-variant">Manage product database</p>
            </div>
            <button onclick="openModal()" class="bg-error text-on-error font-label-bold px-lg py-sm rounded border-2 border-black neo-shadow active-neo-interaction flex items-center gap-xs">
                <span class="material-symbols-outlined">add</span> ADD NEW DROP
            </button>
        </div>
        
        <div class="glass-panel rounded-xl border-border-width border-surface-container-highest overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left font-body-md text-sm">
                    <thead class="bg-surface-container border-b-2 border-surface-container-highest">
                        <tr>
                            <th class="p-sm font-label-bold text-on-surface-variant uppercase">Drop</th>
                            <th class="p-sm font-label-bold text-on-surface-variant uppercase">Price</th>
                            <th class="p-sm font-label-bold text-on-surface-variant uppercase">Stock</th>
                            <th class="p-sm font-label-bold text-on-surface-variant uppercase">Rarity</th>
                            <th class="p-sm font-label-bold text-on-surface-variant uppercase text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="products-tbody" class="divide-y divide-surface-container-highest">
                        <!-- Rendered by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- Tab: Orders -->
    <section id="orders-tab" class="tab-content hidden">
        <div class="flex justify-between items-center mb-md border-b-2 border-surface-container-highest pb-md">
            <div>
                <h1 class="font-display-xl text-[48px] uppercase tracking-tighter text-primary-fixed leading-none">TRANSACTIONS</h1>
                <p class="font-label-bold text-on-surface-variant">Monitor incoming loot bags</p>
            </div>
        </div>
        
        <div class="glass-panel rounded-xl border-border-width border-surface-container-highest overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left font-body-md text-sm">
                    <thead class="bg-surface-container border-b-2 border-surface-container-highest">
                        <tr>
                            <th class="p-sm font-label-bold text-on-surface-variant uppercase">Order ID</th>
                            <th class="p-sm font-label-bold text-on-surface-variant uppercase">User</th>
                            <th class="p-sm font-label-bold text-on-surface-variant uppercase">Total</th>
                            <th class="p-sm font-label-bold text-on-surface-variant uppercase">Status</th>
                            <th class="p-sm font-label-bold text-on-surface-variant uppercase text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="orders-tbody" class="divide-y divide-surface-container-highest">
                        <!-- Rendered by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- Tab: Users -->
    <section id="users-tab" class="tab-content hidden">
        <div class="flex justify-between items-center mb-md border-b-2 border-surface-container-highest pb-md">
            <div>
                <h1 class="font-display-xl text-[48px] uppercase tracking-tighter text-secondary-container leading-none">USER DATABASE</h1>
                <p class="font-label-bold text-on-surface-variant">Manage the cult members</p>
            </div>
        </div>
        
        <div class="glass-panel rounded-xl border-border-width border-surface-container-highest overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left font-body-md text-sm">
                    <thead class="bg-surface-container border-b-2 border-surface-container-highest">
                        <tr>
                            <th class="p-sm font-label-bold text-on-surface-variant uppercase">ID</th>
                            <th class="p-sm font-label-bold text-on-surface-variant uppercase">Name</th>
                            <th class="p-sm font-label-bold text-on-surface-variant uppercase">Email</th>
                            <th class="p-sm font-label-bold text-on-surface-variant uppercase">Admin</th>
                            <th class="p-sm font-label-bold text-on-surface-variant uppercase text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody" class="divide-y divide-surface-container-highest">
                        <!-- Rendered by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<!-- Add/Edit Product Modal -->
<div id="product-modal" class="hidden fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex items-center justify-center p-md">
    <div class="bg-surface-container-low border-2 border-surface-container-highest rounded-xl neo-shadow w-full max-w-2xl max-h-[90vh] overflow-y-auto relative">
        <button onclick="closeModal()" class="absolute top-md right-md material-symbols-outlined hover:text-error">close</button>
        <div class="p-lg">
            <h2 id="modal-title" class="font-headline-lg text-primary uppercase mb-lg">ADD NEW DROP</h2>
            <form id="product-form" class="space-y-md">
                <input type="hidden" id="prod-id">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-md">
                    <div>
                        <label class="font-label-bold text-xs uppercase text-on-surface-variant mb-xs block">Name</label>
                        <input id="prod-name" required type="text" class="w-full bg-surface-container border-2 border-surface-container-highest rounded px-sm py-xs font-body-md text-on-surface focus:border-error focus:outline-none">
                    </div>
                    <div>
                        <label class="font-label-bold text-xs uppercase text-on-surface-variant mb-xs block">Price</label>
                        <input id="prod-price" required type="number" step="0.01" class="w-full bg-surface-container border-2 border-surface-container-highest rounded px-sm py-xs font-body-md text-on-surface focus:border-error focus:outline-none">
                    </div>
                    <div>
                        <label class="font-label-bold text-xs uppercase text-on-surface-variant mb-xs block">Stock</label>
                        <input id="prod-stock" required type="number" class="w-full bg-surface-container border-2 border-surface-container-highest rounded px-sm py-xs font-body-md text-on-surface focus:border-error focus:outline-none">
                    </div>
                    <div>
                        <label class="font-label-bold text-xs uppercase text-on-surface-variant mb-xs block">Category</label>
                        <input id="prod-category" required type="text" class="w-full bg-surface-container border-2 border-surface-container-highest rounded px-sm py-xs font-body-md text-on-surface focus:border-error focus:outline-none">
                    </div>
                    <div>
                        <label class="font-label-bold text-xs uppercase text-on-surface-variant mb-xs block">Rarity</label>
                        <select id="prod-rarity" class="w-full bg-surface-container border-2 border-surface-container-highest rounded px-sm py-xs font-body-md text-on-surface focus:border-error focus:outline-none">
                            <option value="CORE COLLECTION">CORE COLLECTION</option>
                            <option value="LIMITED EDITION">LIMITED EDITION</option>
                            <option value="LEGENDARY DROP">LEGENDARY DROP</option>
                            <option value="VAULT ITEM">VAULT ITEM</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="font-label-bold text-xs uppercase text-on-surface-variant mb-xs block">Description</label>
                        <textarea id="prod-desc" required rows="3" class="w-full bg-surface-container border-2 border-surface-container-highest rounded px-sm py-xs font-body-md text-on-surface focus:border-error focus:outline-none"></textarea>
                    </div>
                    <div class="md:col-span-2">
                        <label class="font-label-bold text-xs uppercase text-on-surface-variant mb-xs block">Image URLs (comma separated)</label>
                        <input id="prod-images" required type="text" class="w-full bg-surface-container border-2 border-surface-container-highest rounded px-sm py-xs font-body-md text-on-surface focus:border-error focus:outline-none" placeholder="https://..., https://...">
                    </div>
                    <div class="md:col-span-2">
                        <label class="font-label-bold text-xs uppercase text-on-surface-variant mb-xs block">Sizes (comma separated)</label>
                        <input id="prod-sizes" type="text" class="w-full bg-surface-container border-2 border-surface-container-highest rounded px-sm py-xs font-body-md text-on-surface focus:border-error focus:outline-none" placeholder="XS, S, M, L, XL">
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-error text-on-error font-headline-md py-md rounded-lg border-2 border-black neo-shadow active-neo-interaction mt-lg uppercase">
                    SAVE DROP DATA
                </button>
            </form>
        </div>
    </div>
</div>

<script src="/js/main.js"></script>
<script src="/js/admin.js"></script>
</body></html>
