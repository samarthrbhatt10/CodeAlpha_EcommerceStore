<script>
        // Mascot Eye Tracking
        const mascotContainer = document.getElementById('mascot-container');
        const eyeLeft = document.getElementById('eye-left');
        const eyeRight = document.getElementById('eye-right');

        document.addEventListener('mousemove', (e) => {
            if (!mascotContainer) return;
            
            const rect = mascotContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const dx = e.clientX - centerX;
            const dy = e.clientY - centerY;
            
            const angle = Math.atan2(dy, dx);
            const distance = Math.min(10, Math.sqrt(dx*dx + dy*dy) / 20);
            
            const moveX = Math.cos(angle) * distance;
            const moveY = Math.sin(angle) * distance;
            
            eyeLeft.style.transform = `translate(${moveX}px, ${moveY}px)`;
            eyeRight.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });

        // Toggle Logic
        function toggleAuth(type) {
            const toggleBg = document.getElementById('toggle-bg');
            const btnLogin = document.getElementById('btn-login');
            const btnSignup = document.getElementById('btn-signup');
            const title = document.getElementById('auth-title');
            const signupFields = document.getElementById('signup-fields');
            const submitBtn = document.getElementById('submit-btn');

            if (type === 'signup') {
                toggleBg.style.transform = 'translateX(100%)';
                btnLogin.classList.add('text-on-surface-variant');
                btnLogin.classList.remove('text-on-primary-fixed');
                btnSignup.classList.remove('text-on-surface-variant');
                btnSignup.classList.add('text-on-primary-fixed');
                
                title.innerHTML = `
                    <h2 class="font-headline-md text-headline-md text-primary mb-xs">JOIN THE CLUB</h2>
                    <p class="text-on-surface-variant">Rare aesthetics, zero friction.</p>
                `;
                signupFields.classList.remove('hidden');
                submitBtn.innerText = 'CREATE ACCOUNT';
            } else {
                toggleBg.style.transform = 'translateX(0%)';
                btnSignup.classList.add('text-on-surface-variant');
                btnSignup.classList.remove('text-on-primary-fixed');
                btnLogin.classList.remove('text-on-surface-variant');
                btnLogin.classList.add('text-on-primary-fixed');
                
                title.innerHTML = `
                    <h2 class="font-headline-md text-headline-md text-primary mb-xs">WELCOME BACK</h2>
                    <p class="text-on-surface-variant">The arcade is waiting for you.</p>
                `;
                signupFields.classList.add('hidden');
                submitBtn.innerText = 'LOG IN';
            }
        }
    </script>
