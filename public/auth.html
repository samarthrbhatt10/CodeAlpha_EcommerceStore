<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CLUB ACCESS | DOPAMINE CLUB</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;700&family=Space+Grotesk:wght@700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
  darkMode:"class",
  theme:{extend:{
    colors:{
      "background":"#14121f","surface":"#14121f","surface-container-lowest":"#0e0c1a",
      "surface-container-low":"#1c1a27","surface-container":"#201e2c","surface-container-high":"#2b2836",
      "surface-container-highest":"#363342","primary":"#ffffff","primary-fixed":"#c3f400",
      "primary-container":"#c3f400","on-primary-container":"#161e00","secondary-container":"#ff4b89",
      "on-surface":"#e5e0f3","on-surface-variant":"#c4c9ac","error":"#ffb4ab","on-error":"#690005"
    },
    fontFamily:{"label-bold":["Space Grotesk"],"headline-md":["Syne"],"display-xl":["Syne"],"body-md":["Plus Jakarta Sans"],"headline-lg":["Syne"]},
    fontSize:{"label-bold":["14px",{lineHeight:"1.0",fontWeight:"700"}],"headline-md":["24px",{lineHeight:"1.3",fontWeight:"700"}],"headline-lg":["48px",{lineHeight:"1.2",fontWeight:"800"}],"body-md":["16px",{lineHeight:"1.6",fontWeight:"400"}]},
    spacing:{"xs":"4px","sm":"12px","md":"24px","lg":"48px","xl":"80px","border-width":"2px","base":"8px","3":"3px"}
  }}
};
</script>
<style>
  body { background: #14121f; color: #e5e0f3; font-family: 'Plus Jakarta Sans', sans-serif; }
  .neo-shadow { box-shadow: 6px 6px 0px #0D0B18; }
  .holographic { background: linear-gradient(135deg,#c3f400,#00dbe9,#ff4b89,#c3f400); background-size:300% 300%; animation: holo 4s ease infinite; }
  @keyframes holo { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-size:24px; font-style:normal; font-weight:normal; line-height:1; display:inline-block; white-space:nowrap; font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
  input:focus { outline:none; }
</style>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center overflow-x-hidden p-md">

<div class="w-full max-w-md">
  <!-- Logo -->
  <div class="text-center mb-xl">
    <a href="/" class="font-headline-lg text-primary-container italic uppercase tracking-tighter">DOPAMINE CLUB</a>
    <p class="text-on-surface-variant mt-sm text-sm">Join the digital natives</p>
  </div>

  <!-- Mode toggle -->
  <div class="flex bg-surface-container-high border-2 border-surface-container-highest rounded-xl p-xs mb-xl relative overflow-hidden">
    <div id="mode-indicator" class="absolute top-xs bottom-xs w-1/2 bg-primary-container rounded-lg border-2 border-black transition-transform duration-300"></div>
    <button id="btn-login" onclick="setAuthMode('login')" class="relative z-10 flex-1 py-sm font-label-bold text-on-primary-container text-sm rounded-lg transition-colors">LOG IN</button>
    <button id="btn-signup" onclick="setAuthMode('signup')" class="relative z-10 flex-1 py-sm font-label-bold text-on-surface-variant text-sm rounded-lg transition-colors">JOIN CLUB</button>
  </div>

  <div id="auth-mode-title" class="font-headline-md text-primary mb-lg">Welcome Back</div>

  <!-- Form -->
  <div class="space-y-md">
    <!-- Name (signup only) -->
    <div id="name-section" class="hidden">
      <label class="font-label-bold text-on-surface text-sm block mb-xs">Username</label>
      <input id="name-input" type="text" placeholder="your_dopamine_name" autocomplete="username"
        class="w-full bg-surface-container border-2 border-surface-container-highest rounded-xl px-md py-sm font-body-md text-on-surface placeholder:text-on-surface-variant focus:border-primary-container transition-colors"/>
      <p id="name-input-error" class="hidden text-error text-xs mt-xs font-label-bold"></p>
    </div>

    <!-- Email -->
    <div>
      <label class="font-label-bold text-on-surface text-sm block mb-xs">Email</label>
      <input id="email-input" type="email" placeholder="you@dopamine.club" autocomplete="email"
        class="w-full bg-surface-container border-2 border-surface-container-highest rounded-xl px-md py-sm font-body-md text-on-surface placeholder:text-on-surface-variant focus:border-primary-container transition-colors"/>
      <p id="email-input-error" class="hidden text-error text-xs mt-xs font-label-bold"></p>
    </div>

    <!-- Password -->
    <div>
      <label class="font-label-bold text-on-surface text-sm block mb-xs">Password</label>
      <div class="relative">
        <input id="password-input" type="password" placeholder="Min 6 characters" autocomplete="current-password"
          class="w-full bg-surface-container border-2 border-surface-container-highest rounded-xl px-md py-sm pr-12 font-body-md text-on-surface placeholder:text-on-surface-variant focus:border-primary-container transition-colors"/>
        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-sm top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant hover:text-on-surface transition-colors text-lg" id="pw-toggle-btn">visibility</button>
      </div>
      <p id="password-input-error" class="hidden text-error text-xs mt-xs font-label-bold"></p>
    </div>

    <!-- Submit -->
    <button id="submit-btn" class="w-full bg-primary-container text-on-primary-container font-headline-md py-md rounded-xl border-3 border-black neo-shadow hover:translate-x-[4px] hover:translate-y-[4px] hover:shadow-none transition-all" style="box-shadow:6px 6px 0px #000">
      LOG IN
    </button>

    <!-- Demo credentials hint -->
    <div class="text-center text-xs text-on-surface-variant space-y-xs border-t-2 border-surface-container-highest pt-md">
      <p>Demo account: <button onclick="fillDemo('user')" class="text-primary-container hover:underline font-bold">demo@dopamine.club</button> / demo123</p>
      <p>Admin account: <button onclick="fillDemo('admin')" class="text-primary-container hover:underline font-bold">admin@dopamine.club</button> / admin123</p>
    </div>
  </div>

  <p class="text-center mt-md text-on-surface-variant text-sm">
    <a href="/" class="hover:text-primary-container transition-colors">← Back to Home</a>
  </p>
</div>

<script src="/js/shared_layout.js"></script>
<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
<script>
function togglePasswordVisibility() {
  const input = document.getElementById('password-input');
  const btn = document.getElementById('pw-toggle-btn');
  if (input.type === 'password') { input.type = 'text'; btn.textContent = 'visibility_off'; }
  else { input.type = 'password'; btn.textContent = 'visibility'; }
}

function fillDemo(type) {
  document.getElementById('email-input').value = type === 'admin' ? 'admin@dopamine.club' : 'demo@dopamine.club';
  document.getElementById('password-input').value = type === 'admin' ? 'admin123' : 'demo123';
  setAuthMode('login');
}

window.setAuthMode = function(mode) {
  const submitBtn = document.getElementById('submit-btn');
  const nameSection = document.getElementById('name-section');
  const titleEl = document.getElementById('auth-mode-title');
  const modeIndicator = document.getElementById('mode-indicator');
  const btnLogin = document.getElementById('btn-login');
  const btnSignup = document.getElementById('btn-signup');
  
  ['email-input', 'password-input', 'name-input'].forEach(id => {
    const errEl = document.getElementById(id + '-error');
    if (errEl) { errEl.textContent = ''; errEl.classList.add('hidden'); }
    const inputEl = document.getElementById(id);
    if (inputEl) inputEl.classList.remove('border-error');
  });

  if (mode === 'signup') {
    submitBtn.textContent = 'CREATE ACCOUNT';
    submitBtn.dataset.mode = 'signup';
    nameSection.classList.remove('hidden');
    titleEl.textContent = 'Join the Club';
    modeIndicator.style.transform = 'translateX(100%)';
    btnLogin.classList.remove('text-on-primary-container');
    btnLogin.classList.add('text-on-surface-variant');
    btnSignup.classList.add('text-on-primary-container');
    btnSignup.classList.remove('text-on-surface-variant');
  } else {
    submitBtn.textContent = 'LOG IN';
    submitBtn.dataset.mode = 'login';
    nameSection.classList.add('hidden');
    titleEl.textContent = 'Welcome Back';
    modeIndicator.style.transform = 'translateX(0)';
    btnLogin.classList.add('text-on-primary-container');
    btnLogin.classList.remove('text-on-surface-variant');
    btnSignup.classList.remove('text-on-primary-container');
    btnSignup.classList.add('text-on-surface-variant');
  }
};
</script>
</body>
</html>
