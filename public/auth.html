<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CLUB ACCESS | DOPAMINE CLUB</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;700&family=Space+Grotesk:wght@700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="/js/shared_layout.js"></script>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center overflow-x-hidden p-md font-body-md selection:bg-primary-container selection:text-on-primary-container">

<div class="w-full max-w-md relative z-10 glass-panel p-lg rounded-2xl border-border-width border-surface-container-highest neo-shadow">
  <!-- Logo -->
  <div class="text-center mb-xl">
    <a href="/" class="font-headline-lg text-primary-container italic uppercase tracking-tighter hover:text-primary transition-colors">DOPAMINE CLUB</a>
    <p class="text-on-surface-variant mt-sm text-sm font-label-bold uppercase tracking-widest">System Access</p>
  </div>

  <!-- Mode toggle -->
  <div class="flex bg-surface-container border-2 border-surface-container-highest rounded-xl p-xs mb-lg relative overflow-hidden">
    <div id="mode-indicator" class="absolute top-xs bottom-xs w-[calc(50%-4px)] bg-primary-container rounded-lg border-2 border-black transition-transform duration-300"></div>
    <button id="btn-login" onclick="setAuthMode('login')" class="relative z-10 flex-1 py-sm font-label-bold text-on-primary-container text-sm rounded-lg transition-colors">LOG IN</button>
    <button id="btn-signup" onclick="setAuthMode('signup')" class="relative z-10 flex-1 py-sm font-label-bold text-on-surface-variant text-sm rounded-lg transition-colors">JOIN CLUB</button>
  </div>

  <div id="auth-mode-title" class="font-headline-md text-primary mb-md text-center uppercase tracking-tight">Welcome Back</div>

  <!-- Form -->
  <div class="space-y-md">
    <!-- Name (signup only) -->
    <div id="name-section" class="hidden">
      <label class="font-label-bold text-on-surface text-xs uppercase tracking-wider block mb-xs">Handle</label>
      <input id="name-input" type="text" placeholder="your_dopamine_name" autocomplete="username"
        class="w-full bg-surface-container-highest border-2 border-surface-container-highest rounded-xl px-md py-sm font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary-container focus:bg-surface-container focus:ring-0 transition-colors"/>
      <p id="name-input-error" class="hidden text-error text-xs mt-xs font-label-bold"></p>
    </div>

    <!-- Email -->
    <div>
      <label class="font-label-bold text-on-surface text-xs uppercase tracking-wider block mb-xs">Comm Link (Email)</label>
      <input id="email-input" type="email" placeholder="you@dopamine.club" autocomplete="email"
        class="w-full bg-surface-container-highest border-2 border-surface-container-highest rounded-xl px-md py-sm font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary-container focus:bg-surface-container focus:ring-0 transition-colors"/>
      <p id="email-input-error" class="hidden text-error text-xs mt-xs font-label-bold"></p>
    </div>

    <!-- Password -->
    <div>
      <label class="font-label-bold text-on-surface text-xs uppercase tracking-wider block mb-xs">Passcode</label>
      <div class="relative">
        <input id="password-input" type="password" placeholder="Min 6 characters" autocomplete="current-password"
          class="w-full bg-surface-container-highest border-2 border-surface-container-highest rounded-xl px-md py-sm pr-12 font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary-container focus:bg-surface-container focus:ring-0 transition-colors"/>
        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-sm top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant hover:text-primary transition-colors text-lg" id="pw-toggle-btn">visibility</button>
      </div>
      <p id="password-input-error" class="hidden text-error text-xs mt-xs font-label-bold"></p>
    </div>

    <!-- Submit -->
    <button id="submit-btn" class="w-full bg-primary-fixed text-on-primary-fixed font-headline-md py-md rounded-xl border-border-width border-black shadow-[6px_6px_0px_#000] hover:translate-x-[4px] hover:translate-y-[4px] hover:shadow-none active:scale-[0.98] transition-all uppercase tracking-tight mt-sm">
      INITIALIZE
    </button>

    <!-- Demo credentials hint -->
    <div class="text-center text-xs text-on-surface-variant space-y-xs border-t-border-width border-surface-container-highest pt-md mt-md">
      <p>Demo mode bypass:</p>
      <div class="flex justify-center gap-sm mt-xs">
        <button onclick="fillDemo('user')" class="bg-surface-container hover:bg-surface-container-highest text-primary font-label-bold px-sm py-xs rounded transition-colors border border-surface-container-highest">USER DEMO</button>
        <button onclick="fillDemo('admin')" class="bg-surface-container hover:bg-surface-container-highest text-secondary-container font-label-bold px-sm py-xs rounded transition-colors border border-surface-container-highest">ADMIN OVERRIDE</button>
      </div>
    </div>
  </div>

  <p class="text-center mt-lg text-on-surface-variant text-sm font-label-bold">
    <a href="/" class="hover:text-primary-container hover:underline underline-offset-4 transition-colors">← ABORT TO HOME</a>
  </p>
</div>

<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
<script>
function togglePasswordVisibility() {
  const input = document.getElementById('password-input');
  const btn = document.getElementById('pw-toggle-btn');
  if (input.type === 'password') { input.type = 'text'; btn.textContent = 'visibility_off'; }
  else { input.type = 'password'; btn.textContent = 'visibility'; }
}

function fillDemo(type) {
  document.getElementById('email-input').value = type === 'admin' ? 'admin@dopamine.club' : 'demo@dopamine.club';
  document.getElementById('password-input').value = type === 'admin' ? 'admin123' : 'demo123';
  setAuthMode('login');
}

window.setAuthMode = function(mode) {
  const submitBtn = document.getElementById('submit-btn');
  const nameSection = document.getElementById('name-section');
  const titleEl = document.getElementById('auth-mode-title');
  const modeIndicator = document.getElementById('mode-indicator');
  const btnLogin = document.getElementById('btn-login');
  const btnSignup = document.getElementById('btn-signup');
  
  ['email-input', 'password-input', 'name-input'].forEach(id => {
    const errEl = document.getElementById(id + '-error');
    if (errEl) { errEl.textContent = ''; errEl.classList.add('hidden'); }
    const inputEl = document.getElementById(id);
    if (inputEl) inputEl.classList.remove('border-error');
  });

  if (mode === 'signup') {
    submitBtn.textContent = 'CREATE RECORD';
    submitBtn.dataset.mode = 'signup';
    nameSection.classList.remove('hidden');
    titleEl.textContent = 'Join the Club';
    modeIndicator.style.transform = 'translateX(100%)';
    btnLogin.classList.remove('text-on-primary-container');
    btnLogin.classList.add('text-on-surface-variant');
    btnSignup.classList.add('text-on-primary-container');
    btnSignup.classList.remove('text-on-surface-variant');
  } else {
    submitBtn.textContent = 'INITIALIZE';
    submitBtn.dataset.mode = 'login';
    nameSection.classList.add('hidden');
    titleEl.textContent = 'Welcome Back';
    modeIndicator.style.transform = 'translateX(0)';
    btnLogin.classList.add('text-on-primary-container');
    btnLogin.classList.remove('text-on-surface-variant');
    btnSignup.classList.remove('text-on-primary-container');
    btnSignup.classList.add('text-on-surface-variant');
  }
};
</script>
</body></html>
