<script>
        function burst(btn) {
            const colors = ['#abd600', '#ffb1c3', '#00dbe9', '#ffffff'];
            const icon = btn.querySelector('span');
            icon.style.fontVariationSettings = "'FILL' 1";
            icon.classList.add('scale-125');
            
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.className = 'confetti';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                btn.appendChild(particle);

                const angle = Math.random() * Math.PI * 2;
                const distance = 40 + Math.random() * 60;
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;

                particle.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${x}px, ${y}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 800,
                    easing: 'cubic-bezier(0, .9, .57, 1)'
                }).onfinish = () => particle.remove();
            }
            
            setTimeout(() => {
                icon.classList.remove('scale-125');
            }, 200);
        }

        function instantCop(btn) {
            const originalContent = btn.innerHTML;
            btn.classList.remove('bg-primary-fixed', 'bg-secondary-container', 'bg-primary');
            btn.classList.add('bg-primary-fixed-dim');
            btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> COP\'D!';
            
            // Add a little celebratory shake
            btn.animate([
                { transform: 'scale(1)' },
                { transform: 'scale(1.1) rotate(2deg)' },
                { transform: 'scale(1)' }
            ], { duration: 300 });

            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.classList.remove('bg-primary-fixed-dim');
                if (btn.innerText.includes('INSTANT COP')) {
                   // Keep original colors if we wanted persistence, but resetting for demo
                }
            }, 2000);
        }
    </script>
