<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DOPAMINE CLUB | CATALOG</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;700&family=Space+Grotesk:wght@700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="/js/shared_layout.js"></script>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">

<header class="sticky top-md z-40 flex justify-between items-center px-md py-sm rounded-full border-border-width border-surface-container-highest mt-md mx-auto w-[95%] max-w-7xl bg-surface-container-low/20 backdrop-blur-xl shadow-offset-shadow transition-all duration-300">
<div class="font-headline-lg text-headline-lg-mobile italic uppercase tracking-tighter text-primary dark:text-primary-fixed cursor-pointer" onclick="window.location.href='/'">
    DOPAMINE CLUB
</div>
<nav class="hidden md:flex gap-md items-center">
    <a class="font-label-bold text-label-bold text-primary-fixed-dim border-b-border-width border-primary-fixed-dim hover:text-secondary-fixed-dim hover:scale-105 transition-transform" href="/catalog.html">DROPS</a>
    <a class="font-label-bold text-label-bold text-on-surface-variant hover:text-secondary-fixed-dim hover:scale-105 transition-transform" href="/catalog.html">VAULT</a>
</nav>
<div class="flex items-center gap-sm">
    <button class="p-2 text-primary hover:scale-110 transition-transform relative" data-cart-toggle>
        <span class="material-symbols-outlined" data-icon="shopping_bag">shopping_bag</span>
        <span id="nav-cart-count" class="absolute -top-1 -right-1 bg-primary-container text-on-primary-container text-[10px] font-bold px-1 rounded-full">0</span>
    </button>
    <button onclick="window.location.href='/auth.html'" id="nav-auth-btn" class="bg-primary-fixed text-on-primary-fixed font-label-bold text-label-bold px-md py-xs rounded-full border-border-width border-surface-variant hover:translate-x-[4px] hover:translate-y-[4px] hover:shadow-none transition-all active:scale-95">LOGIN</button>
</div>
</header>

<main class="pt-20 pb-xl px-md max-w-7xl mx-auto relative">
<!-- Stickers scattered around UI -->
<div class="holographic-sticker absolute -top-10 -left-10 px-sm py-xs font-label-bold text-on-tertiary-fixed rounded-lg z-10 rotate-[-12deg]">NEW DROP</div>
<div class="holographic-sticker absolute top-20 right-0 px-sm py-xs font-label-bold text-on-tertiary-fixed rounded-full z-10 rotate-[15deg]">LIMITED</div>

<!-- Section Title and Search -->
<div class="mb-xl text-center md:text-left flex flex-col md:flex-row justify-between items-end gap-lg">
    <div>
        <h1 class="font-display-xl text-[64px] md:text-display-xl uppercase tracking-tighter leading-none mb-md">
            Find Your <span class="text-primary-fixed italic">Vibe</span>
        </h1>
        <div class="flex flex-wrap gap-sm mt-md">
            <button onclick="setCategory('ALL', this)" data-filter-btn class="bg-primary-container text-on-primary-container border-border-width border-black px-md py-sm font-label-bold text-label-bold rounded-full hover:scale-105 transition-all shadow-offset-shadow">ALL DROPS</button>
            <button onclick="setCategory('Apparel', this)" data-filter-btn class="bg-surface-container-high text-on-surface-variant border-border-width border-surface-container-highest px-md py-sm font-label-bold text-label-bold rounded-full hover:border-primary-fixed hover:text-primary-fixed transition-all">APPAREL</button>
            <button onclick="setCategory('Accessories', this)" data-filter-btn class="bg-surface-container-high text-on-surface-variant border-border-width border-surface-container-highest px-md py-sm font-label-bold text-label-bold rounded-full hover:border-primary-fixed hover:text-primary-fixed transition-all">ACCESSORIES</button>
            <button onclick="setCategory('Collectibles', this)" data-filter-btn class="bg-surface-container-high text-on-surface-variant border-border-width border-surface-container-highest px-md py-sm font-label-bold text-label-bold rounded-full hover:border-primary-fixed hover:text-primary-fixed transition-all">COLLECTIBLES</button>
        </div>
    </div>
    
    <!-- Search Bar -->
    <div class="w-full md:w-auto relative group">
        <input type="text" id="search-input" placeholder="Search the drop..." class="w-full md:w-64 bg-surface-container border-2 border-surface-container-highest rounded-full py-sm pl-xl pr-md text-primary placeholder-on-surface-variant focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all">
        <span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary-container transition-colors">search</span>
    </div>
</div>

<!-- Metadata bar -->
<div class="flex justify-between items-center mb-md border-b-2 border-surface-container-highest pb-sm">
    <span class="font-label-bold text-on-surface-variant">SHOWING: <span id="product-count" class="text-primary">0 items</span></span>
</div>

<!-- Empty state -->
<div id="empty-state" class="hidden py-xl text-center">
    <div class="inline-block p-lg bg-surface-container rounded-full mb-md animate-float">
        <span class="material-symbols-outlined text-6xl text-on-surface-variant">search_off</span>
    </div>
    <h3 class="font-headline-md text-primary mb-xs">NOTHING FOUND</h3>
    <p class="text-on-surface-variant font-body-md">The vibe you're looking for doesn't exist yet.</p>
</div>

<!-- Catalog Grid (Populated by catalog.js) -->
<div id="product-grid" class="grid grid-cols-1 md:grid-cols-12 gap-md items-start">
    <!-- Products injected here -->
</div>

</main>

<footer class="w-full py-xl px-lg flex flex-col md:flex-row justify-between items-center gap-md border-t-3 border-surface-variant bg-surface-dim mt-xl">
    <div class="flex flex-col gap-sm items-center md:items-start">
        <div class="font-headline-md text-headline-md text-secondary-fixed italic uppercase">DOPAMINE CLUB</div>
        <p class="font-body-md text-body-md text-on-surface-variant max-w-xs text-center md:text-left">
            ©2024 DOPAMINE CLUB / POP MART UNIVERSE
        </p>
    </div>
</footer>

<script src="/js/main.js"></script>
<script src="/js/catalog.js"></script>
</body></html>
