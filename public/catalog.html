<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="Browse all Dopamine Club drops — streetwear, collectibles, footwear & accessories. Filter by category and find your vibe."/>
<title>THE DROP VAULT | DOPAMINE CLUB</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;700&family=Space+Grotesk:wght@700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
  darkMode:"class",
  theme:{extend:{
    colors:{
      "background":"#14121f","surface":"#14121f","surface-container-lowest":"#0e0c1a",
      "surface-container-low":"#1c1a27","surface-container":"#201e2c","surface-container-high":"#2b2836",
      "surface-container-highest":"#363342","primary":"#ffffff","primary-fixed":"#c3f400",
      "primary-container":"#c3f400","on-primary-container":"#161e00","secondary-container":"#ff4b89",
      "on-secondary-container":"#590026","on-surface":"#e5e0f3","on-surface-variant":"#c4c9ac",
      "error":"#ffb4ab"
    },
    fontFamily:{"label-bold":["Space Grotesk"],"headline-md":["Syne"],"display-xl":["Syne"],"body-lg":["Plus Jakarta Sans"],"headline-lg":["Syne"],"body-md":["Plus Jakarta Sans"]},
    fontSize:{"label-bold":["14px",{lineHeight:"1.0",fontWeight:"700"}],"headline-md":["24px",{lineHeight:"1.3",fontWeight:"700"}],"headline-lg":["48px",{lineHeight:"1.2",fontWeight:"800"}],"body-md":["16px",{lineHeight:"1.6",fontWeight:"400"}]},
    spacing:{"xs":"4px","sm":"12px","md":"24px","lg":"48px","xl":"80px","border-width":"2px","base":"8px"},
    boxShadow:{"offset":"6px 6px 0px #0D0B18"}
  }}
};
</script>
<style>
  body { background: #14121f; color: #e5e0f3; font-family: 'Plus Jakarta Sans', sans-serif; }
  .neo-shadow { box-shadow: 6px 6px 0px #0D0B18; }
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-size:24px; font-style:normal; font-weight:normal; line-height:1; display:inline-block; white-space:nowrap; font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
  #toast-container .opacity-100 { pointer-events:auto; }
</style>
</head>
<body class="bg-background text-on-surface min-h-screen overflow-x-hidden">

<!-- Navigation -->
<header class="sticky top-0 z-50 bg-surface/90 backdrop-blur-xl border-b-2 border-surface-container-highest">
  <nav class="flex justify-between items-center px-md py-sm max-w-7xl mx-auto">
    <a href="/" class="font-headline-md text-primary-container italic uppercase tracking-tighter">DOPAMINE CLUB</a>
    <div class="hidden md:flex items-center gap-lg">
      <a href="/catalog" class="font-label-bold text-primary-container border-b-2 border-primary-container pb-xs">DROPS</a>
      <a href="/catalog" class="font-label-bold text-on-surface-variant hover:text-primary-container transition-colors">VAULT</a>
      <a href="/catalog" class="font-label-bold text-on-surface-variant hover:text-primary-container transition-colors">COLLECTIBLES</a>
    </div>
    <div class="flex items-center gap-sm">
      <button data-cart-toggle class="relative flex items-center gap-xs font-label-bold bg-surface-container px-md py-xs rounded-full border-2 border-surface-container-highest hover:border-primary-container transition-colors">
        <span class="material-symbols-outlined text-lg">shopping_bag</span>
        <span data-cart-label>Cart</span>
        <span data-cart-count class="absolute -top-1 -right-1 w-5 h-5 bg-secondary-container text-white text-[10px] font-bold rounded-full items-center justify-center hidden">0</span>
      </button>
      <button data-auth-login class="font-label-bold bg-primary-container text-on-primary-container px-md py-xs rounded-full border-2 border-black hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-none transition-all" style="box-shadow:3px 3px 0px #000">LOGIN</button>
    </div>
  </nav>
</header>

<main class="max-w-7xl mx-auto px-md py-lg">
  <!-- Page Header -->
  <div class="mb-xl">
    <h1 class="font-headline-lg text-primary">THE DROP VAULT</h1>
    <p class="text-on-surface-variant mt-xs">Browse all drops. Find your vibe. <span id="product-count" class="text-primary-container font-label-bold"></span></p>
  </div>

  <!-- Search + Filter Bar -->
  <div class="flex flex-col sm:flex-row gap-md mb-xl">
    <div class="relative flex-1">
      <span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">search</span>
      <input
        id="search-input"
        type="text"
        placeholder="Search drops, tags, vibes..."
        class="w-full bg-surface-container border-2 border-surface-container-highest rounded-xl pl-10 pr-md py-sm font-body-md text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary-container transition-colors"
      />
    </div>
  </div>

  <!-- Category Filters -->
  <div class="flex flex-wrap gap-sm mb-xl">
    <button data-filter-btn onclick="setCategory('ALL', this)" class="font-label-bold text-sm px-md py-sm rounded-full border-2 border-black bg-primary-container text-on-primary-container transition-all hover:translate-x-[2px] hover:translate-y-[2px]" style="box-shadow:3px 3px 0px #000">ALL</button>
    <button data-filter-btn onclick="setCategory('Apparel', this)" class="font-label-bold text-sm px-md py-sm rounded-full border-2 border-surface-container-highest bg-surface-container-high text-on-surface-variant hover:border-primary-container transition-all">APPAREL</button>
    <button data-filter-btn onclick="setCategory('Footwear', this)" class="font-label-bold text-sm px-md py-sm rounded-full border-2 border-surface-container-highest bg-surface-container-high text-on-surface-variant hover:border-primary-container transition-all">FOOTWEAR</button>
    <button data-filter-btn onclick="setCategory('Accessories', this)" class="font-label-bold text-sm px-md py-sm rounded-full border-2 border-surface-container-highest bg-surface-container-high text-on-surface-variant hover:border-primary-container transition-all">ACCESSORIES</button>
    <button data-filter-btn onclick="setCategory('Collectibles', this)" class="font-label-btn text-sm px-md py-sm rounded-full border-2 border-surface-container-highest bg-surface-container-high text-on-surface-variant hover:border-primary-container transition-all">COLLECTIBLES</button>
  </div>

  <!-- Product Grid -->
  <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-md">
    <!-- Populated by catalog.js -->
  </div>

  <!-- Empty State -->
  <div id="empty-state" class="hidden text-center py-xl">
    <span class="material-symbols-outlined text-5xl text-on-surface-variant">search_off</span>
    <h3 class="font-headline-md text-primary mt-md">No drops found</h3>
    <p class="text-on-surface-variant mt-sm">Try a different search or browse all categories</p>
    <button onclick="document.getElementById('search-input').value=''; searchQuery=''; setCategory('ALL', document.querySelector('[data-filter-btn]'))" class="mt-md bg-primary-container text-on-primary-container font-label-bold px-lg py-sm rounded border-2 border-black" style="box-shadow:3px 3px 0px #000">CLEAR FILTERS</button>
  </div>
</main>

<!-- Footer -->
<footer class="px-md py-lg border-t-2 border-surface-container-highest mt-xl">
  <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-sm">
    <span class="font-label-bold text-primary-container italic">DOPAMINE CLUB</span>
    <div class="flex gap-lg">
      <a href="/" class="text-on-surface-variant hover:text-primary-container transition-colors text-sm">Home</a>
      <a href="/profile" class="text-on-surface-variant hover:text-primary-container transition-colors text-sm">Profile</a>
      <a href="/admin" class="text-on-surface-variant hover:text-primary-container transition-colors text-sm">Admin</a>
    </div>
    <span class="text-on-surface-variant text-xs">© 2026 DOPAMINE CLUB</span>
  </div>
</footer>

<script src="/js/shared_layout.js"></script>
<script src="/js/main.js"></script>
<script src="/js/catalog.js"></script>
</body>
</html>
