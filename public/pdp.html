<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DOPAMINE CLUB | PDP</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;700&family=Space+Grotesk:wght@700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="/js/shared_layout.js"></script>
</head>
<body class="bg-background text-on-background min-h-screen selection:bg-primary-container selection:text-on-primary-container font-body-md overflow-x-hidden">

<header class="sticky top-md z-50 flex justify-between items-center px-md py-sm rounded-full border-border-width border-surface-container-highest mt-md mx-auto w-[95%] max-w-7xl bg-surface-container-low/20 backdrop-blur-xl shadow-offset-shadow transition-all duration-300">
<div class="font-headline-lg text-headline-lg-mobile italic uppercase tracking-tighter text-primary dark:text-primary-fixed cursor-pointer" onclick="window.location.href='/'">
    DOPAMINE CLUB
</div>
<nav class="hidden md:flex gap-md items-center">
    <a class="font-label-bold text-label-bold text-primary-fixed-dim border-b-border-width border-primary-fixed-dim hover:text-secondary-fixed-dim hover:scale-105 transition-transform" href="/catalog.html">DROPS</a>
    <a class="font-label-bold text-label-bold text-on-surface-variant hover:text-secondary-fixed-dim hover:scale-105 transition-transform" href="/catalog.html">VAULT</a>
</nav>
<div class="flex items-center gap-sm">
    <button class="p-2 text-primary hover:scale-110 transition-transform relative" data-cart-toggle>
        <span class="material-symbols-outlined" data-icon="shopping_bag">shopping_bag</span>
        <span id="nav-cart-count" class="absolute -top-1 -right-1 bg-primary-container text-on-primary-container text-[10px] font-bold px-1 rounded-full">0</span>
    </button>
    <button onclick="window.location.href='/auth.html'" id="nav-auth-btn" class="bg-primary-fixed text-on-primary-fixed font-label-bold text-label-bold px-md py-xs rounded-full border-border-width border-surface-variant hover:translate-x-[4px] hover:translate-y-[4px] hover:shadow-none transition-all active:scale-95">LOGIN</button>
</div>
</header>

<main class="max-w-7xl mx-auto px-md py-lg grid grid-cols-1 lg:grid-cols-12 gap-lg relative mt-xl">
<!-- Floating Holographic Price Tag -->
<div class="absolute top-0 right-10 lg:right-40 z-20 rotate-12 bg-surface-container/50 backdrop-blur-md p-md rounded-xl border-2 border-white/30 neo-shadow animate-float">
    <p class="font-label-bold text-[10px] text-white tracking-widest uppercase mb-1" id="pdp-rarity">RARITY</p>
    <p class="font-display-xl text-3xl font-extrabold text-primary" id="pdp-float-price">$$$</p>
</div>

<!-- Product Gallery Column -->
<div class="lg:col-span-7 space-y-md">
    <div class="relative group">
        <div class="w-full aspect-[4/5] bg-surface-container-low border-border-width border-surface-container-highest rounded-xl overflow-hidden shadow-offset-shadow">
            <img id="pdp-main-img" class="w-full h-full object-cover transition-opacity duration-300" src="" />
        </div>
        <!-- Interactive Stickers -->
        <div class="absolute top-4 left-4 -rotate-3 bg-white text-black font-label-bold px-3 py-1 border-2 border-black rounded-sm shadow-[2px_2px_0px_#000] z-20" id="pdp-category">
            CATEGORY
        </div>
        <div class="absolute bottom-10 right-4 rotate-6 bg-primary-container text-on-primary-container font-label-bold px-3 py-1 border-2 border-black rounded-sm shadow-[2px_2px_0px_#000] z-20" id="pdp-discount" style="display:none;">
            SALE
        </div>
    </div>
    
    <!-- Thumbnail Grid -->
    <div class="grid grid-cols-4 gap-md" id="pdp-thumbs">
        <!-- Thumbnails injected here -->
    </div>
</div>

<!-- Details Column -->
<div class="lg:col-span-5 flex flex-col gap-md">
    <div>
        <div class="flex items-center gap-sm">
            <span class="text-secondary-container font-label-bold tracking-widest uppercase" id="pdp-rating-text">4.5</span>
            <span class="text-[#c3f400] text-sm" id="pdp-stars">★★★★½</span>
            <span class="text-on-surface-variant text-sm" id="pdp-reviews">(0 reviews)</span>
        </div>
        <h1 class="font-headline-lg text-[40px] md:text-[56px] text-primary mt-2 leading-none uppercase" id="pdp-title">LOADING...</h1>
        <p class="font-headline-md text-headline-md text-on-surface-variant font-bold mt-4" id="pdp-desc">Description loading...</p>
    </div>

    <!-- Tags -->
    <div class="flex flex-wrap gap-xs mb-sm" id="pdp-tags">
        <!-- Tags injected here -->
    </div>

    <!-- Size Guide -->
    <div class="bg-surface-container-low p-md rounded-xl border-border-width border-surface-container-highest shadow-offset-shadow" id="size-section">
        <div class="flex justify-between items-center mb-sm">
            <p class="font-label-bold text-on-surface uppercase">Size Energy Levels</p>
            <span class="text-primary-container font-bold" id="selected-size-label">OS</span>
        </div>
        <div class="flex flex-wrap gap-sm" id="pdp-sizes">
            <!-- Sizes injected here -->
        </div>
        <p id="pdp-stock" class="mt-sm font-label-bold text-xs"></p>
    </div>

    <!-- Price and Add Button -->
    <div class="pt-md mt-auto">
        <div class="flex items-baseline gap-sm mb-sm">
            <span class="font-display-xl text-[48px] text-primary leading-none" id="pdp-price"></span>
            <span class="font-headline-md text-on-surface-variant line-through hidden" id="pdp-original-price"></span>
        </div>
        
        <button id="pdp-add-btn" class="w-full bg-primary-fixed text-on-primary-fixed font-display-xl text-2xl h-20 rounded-xl border-border-width border-black shadow-[8px_8px_0px_#000] active:translate-x-1 active:translate-y-1 active:shadow-none transition-all flex items-center justify-center gap-md group">
            INSTANT COP
            <span class="material-symbols-outlined text-4xl group-hover:rotate-12 transition-transform">shopping_cart_checkout</span>
        </button>
        
        <p class="text-center mt-sm font-label-bold text-on-surface-variant text-xs flex justify-center items-center gap-xs">
            <span class="material-symbols-outlined text-sm">bolt</span> FREE OVERNIGHT SHIPPING IN THE METAVERSE
        </p>
    </div>
</div>
</main>

<footer class="w-full py-xl px-lg flex flex-col md:flex-row justify-between items-center gap-md border-t-3 border-surface-variant bg-surface-dim mt-xl">
    <div class="flex flex-col gap-sm items-center md:items-start">
        <div class="font-headline-md text-headline-md text-secondary-fixed italic uppercase">DOPAMINE CLUB</div>
        <p class="font-body-md text-body-md text-on-surface-variant max-w-xs text-center md:text-left">
            ©2024 DOPAMINE CLUB / POP MART UNIVERSE
        </p>
    </div>
</footer>

<script src="/js/main.js"></script>
<script src="/js/pdp.js"></script>
</body></html>
