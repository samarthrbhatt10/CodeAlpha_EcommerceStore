<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Product Details | DOPAMINE CLUB</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;700&family=Space+Grotesk:wght@700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
  darkMode:"class",
  theme:{extend:{
    colors:{
      "background":"#14121f","surface":"#14121f","surface-container-lowest":"#0e0c1a",
      "surface-container-low":"#1c1a27","surface-container":"#201e2c","surface-container-high":"#2b2836",
      "surface-container-highest":"#363342","primary":"#ffffff","primary-fixed":"#c3f400",
      "primary-container":"#c3f400","on-primary-container":"#161e00","secondary-container":"#ff4b89",
      "on-secondary-container":"#590026","on-surface":"#e5e0f3","on-surface-variant":"#c4c9ac",
      "error":"#ffb4ab"
    },
    fontFamily:{"label-bold":["Space Grotesk"],"headline-md":["Syne"],"display-xl":["Syne"],"body-lg":["Plus Jakarta Sans"],"headline-lg":["Syne"],"body-md":["Plus Jakarta Sans"]},
    fontSize:{"label-bold":["14px",{lineHeight:"1.0",fontWeight:"700"}],"headline-md":["24px",{lineHeight:"1.3",fontWeight:"700"}],"headline-lg":["48px",{lineHeight:"1.2",fontWeight:"800"}],"body-md":["16px",{lineHeight:"1.6",fontWeight:"400"}]},
    spacing:{"xs":"4px","sm":"12px","md":"24px","lg":"48px","xl":"80px","border-width":"2px","base":"8px"},
    boxShadow:{"offset":"6px 6px 0px #0D0B18"}
  }}
};
</script>
<style>
  body { background: #14121f; color: #e5e0f3; font-family: 'Plus Jakarta Sans', sans-serif; }
  .neo-shadow { box-shadow: 6px 6px 0px #0D0B18; }
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-size:24px; font-style:normal; font-weight:normal; line-height:1; display:inline-block; white-space:nowrap; font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
  #pdp-main-img { transition: opacity 0.15s ease; }
</style>
</head>
<body class="bg-background text-on-surface min-h-screen overflow-x-hidden">

<!-- Navigation -->
<header class="sticky top-0 z-50 bg-surface/90 backdrop-blur-xl border-b-2 border-surface-container-highest">
  <nav class="flex justify-between items-center px-md py-sm max-w-7xl mx-auto">
    <a href="/" class="font-headline-md text-primary-container italic uppercase tracking-tighter">DOPAMINE CLUB</a>
    <div class="hidden md:flex items-center gap-lg">
      <a href="/catalog" class="font-label-bold text-on-surface-variant hover:text-primary-container transition-colors">DROPS</a>
      <a href="/catalog" class="font-label-bold text-on-surface-variant hover:text-primary-container transition-colors">VAULT</a>
    </div>
    <div class="flex items-center gap-sm">
      <button data-cart-toggle class="relative flex items-center gap-xs font-label-bold bg-surface-container px-md py-xs rounded-full border-2 border-surface-container-highest hover:border-primary-container transition-colors">
        <span class="material-symbols-outlined text-lg">shopping_bag</span>
        <span data-cart-label>Cart</span>
        <span data-cart-count class="absolute -top-1 -right-1 w-5 h-5 bg-secondary-container text-white text-[10px] font-bold rounded-full items-center justify-center hidden">0</span>
      </button>
      <button data-auth-login class="font-label-bold bg-primary-container text-on-primary-container px-md py-xs rounded-full border-2 border-black hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-none transition-all" style="box-shadow:3px 3px 0px #000">LOGIN</button>
    </div>
  </nav>
</header>

<main class="max-w-7xl mx-auto px-md py-lg">
  <!-- Breadcrumb -->
  <nav class="flex items-center gap-xs text-sm text-on-surface-variant mb-lg">
    <a href="/" class="hover:text-primary-container transition-colors">Home</a>
    <span class="material-symbols-outlined text-sm">chevron_right</span>
    <a href="/catalog" class="hover:text-primary-container transition-colors">Catalog</a>
    <span class="material-symbols-outlined text-sm">chevron_right</span>
    <span id="pdp-title" class="text-primary">Loading...</span>
  </nav>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-xl">
    <!-- Gallery -->
    <div class="space-y-md">
      <div class="relative aspect-square bg-surface-container-low border-2 border-surface-container-highest rounded-2xl overflow-hidden">
        <img id="pdp-main-img" src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=800" alt="Product" class="w-full h-full object-cover"/>
      </div>
      <!-- Thumbnails -->
      <div id="pdp-thumbs" class="grid grid-cols-4 gap-sm">
        <!-- Populated by pdp.js -->
      </div>
    </div>

    <!-- Product Info -->
    <div class="space-y-md">
      <div>
        <div class="flex items-center gap-sm flex-wrap">
          <span id="pdp-rarity" class="font-label-bold text-xs px-sm py-xs rounded bg-primary-container text-on-primary-container border-2 border-black uppercase">STANDARD</span>
          <span id="pdp-category" class="font-label-bold text-xs text-on-surface-variant uppercase"></span>
        </div>
        <h1 id="pdp-title" class="font-headline-lg text-primary mt-sm leading-tight">Loading product...</h1>
        <div class="flex items-center gap-sm mt-sm flex-wrap">
          <span id="pdp-stars" class="text-primary-container text-lg">★★★★★</span>
          <span id="pdp-rating-text" class="font-label-bold text-on-surface-variant">5.0</span>
          <span id="pdp-reviews" class="text-on-surface-variant text-sm">(0 reviews)</span>
        </div>
      </div>

      <!-- Price -->
      <div class="flex items-baseline gap-md">
        <span id="pdp-price" class="font-headline-lg text-primary-container">$0.00</span>
        <span id="pdp-original-price" class="text-on-surface-variant line-through hidden text-lg"></span>
        <span id="pdp-discount" class="hidden font-label-bold text-sm bg-secondary-container text-white px-sm py-xs rounded"></span>
      </div>

      <!-- Stock -->
      <div id="pdp-stock" class="font-label-bold text-sm text-[#c3f400]">In Stock</div>

      <!-- Description -->
      <p id="pdp-desc" class="font-body-md text-on-surface-variant leading-relaxed">Loading description...</p>

      <!-- Size Selector -->
      <div id="size-section">
        <div class="flex justify-between items-center mb-sm">
          <span class="font-label-bold text-on-surface uppercase text-sm">Select Size</span>
          <span class="font-label-bold text-primary-container text-sm" id="selected-size-label"></span>
        </div>
        <div id="pdp-sizes" class="flex flex-wrap gap-sm">
          <!-- Populated by pdp.js -->
        </div>
      </div>

      <!-- Tags -->
      <div id="pdp-tags" class="flex flex-wrap gap-xs">
        <!-- Populated by pdp.js -->
      </div>

      <!-- Actions -->
      <div class="space-y-sm pt-md">
        <button id="pdp-add-btn" class="w-full bg-primary-container text-on-primary-container font-headline-md py-md rounded-xl border-3 border-black hover:translate-x-[4px] hover:translate-y-[4px] hover:shadow-none transition-all flex items-center justify-center gap-sm" style="box-shadow:6px 6px 0px #000">
          <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1">add_shopping_cart</span>
          ADD TO STASH
        </button>
        <button onclick="window.location.href='/catalog'" class="w-full border-2 border-surface-container-highest text-on-surface-variant font-label-bold py-md rounded-xl hover:border-primary-container hover:text-primary-container transition-all text-center">
          ← CONTINUE SHOPPING
        </button>
      </div>

      <!-- Perks -->
      <div class="grid grid-cols-3 gap-sm pt-md border-t-2 border-surface-container-highest">
        <div class="text-center">
          <span class="material-symbols-outlined text-primary-container block mb-xs">local_shipping</span>
          <p class="text-xs text-on-surface-variant font-label-bold">Free over $200</p>
        </div>
        <div class="text-center">
          <span class="material-symbols-outlined text-primary-container block mb-xs">loop</span>
          <p class="text-xs text-on-surface-variant font-label-bold">30-day returns</p>
        </div>
        <div class="text-center">
          <span class="material-symbols-outlined text-primary-container block mb-xs">verified</span>
          <p class="text-xs text-on-surface-variant font-label-bold">Authentic drops</p>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="/js/shared_layout.js"></script>
<script src="/js/main.js"></script>
<script src="/js/pdp.js"></script>
</body>
</html>
