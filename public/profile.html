<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PLAYER STATS | DOPAMINE CLUB</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;700&family=Space+Grotesk:wght@700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="/js/shared_layout.js"></script>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">

<header class="sticky top-md z-50 flex justify-between items-center px-md py-sm rounded-full border-border-width border-surface-container-highest mt-md mx-auto w-[95%] max-w-7xl bg-surface-container-low/20 backdrop-blur-xl shadow-offset-shadow transition-all duration-300">
<div class="font-headline-lg text-headline-lg-mobile italic uppercase tracking-tighter text-primary dark:text-primary-fixed cursor-pointer" onclick="window.location.href='/'">
    DOPAMINE CLUB
</div>
<nav class="hidden md:flex gap-md items-center">
    <a class="font-label-bold text-label-bold text-on-surface-variant hover:text-secondary-fixed-dim hover:scale-105 transition-transform" href="/catalog.html">DROPS</a>
    <a class="font-label-bold text-label-bold text-on-surface-variant hover:text-secondary-fixed-dim hover:scale-105 transition-transform" href="/catalog.html">VAULT</a>
</nav>
<div class="flex items-center gap-sm">
    <button class="p-2 text-primary hover:scale-110 transition-transform relative" data-cart-toggle>
        <span class="material-symbols-outlined" data-icon="shopping_bag">shopping_bag</span>
        <span id="nav-cart-count" class="absolute -top-1 -right-1 bg-primary-container text-on-primary-container text-[10px] font-bold px-1 rounded-full">0</span>
    </button>
    <button onclick="logout()" id="nav-logout-btn" class="bg-surface-container text-on-surface font-label-bold text-label-bold px-md py-xs rounded-full border-border-width border-surface-container-highest hover:text-error transition-all active:scale-95">LOGOUT</button>
</div>
</header>

<main class="pt-20 pb-xl px-md max-w-7xl mx-auto relative">
<div class="mb-xl text-center md:text-left flex flex-col md:flex-row justify-between items-end gap-lg border-b-border-width border-surface-container-highest pb-md">
    <div>
        <h1 class="font-display-xl text-[64px] md:text-display-xl uppercase tracking-tighter leading-none mb-sm text-primary">
            PLAYER <span class="text-primary-fixed italic">STATS</span>
        </h1>
        <p class="text-on-surface-variant font-label-bold uppercase tracking-widest text-sm" id="profile-email">Loading...</p>
    </div>
    <div class="flex gap-sm">
        <button onclick="window.location.href='/settings.html'" class="bg-surface-container text-on-surface border-border-width border-surface-container-highest px-md py-sm font-label-bold text-label-bold rounded-full hover:border-primary-fixed hover:text-primary-fixed transition-all flex items-center gap-xs">
            <span class="material-symbols-outlined text-sm">settings</span>
            SYSTEM OVERRIDE
        </button>
    </div>
</div>

<div class="grid grid-cols-1 md:grid-cols-12 gap-lg items-start">
    
    <!-- User Info Card -->
    <div class="md:col-span-4 space-y-md">
        <div class="glass-panel p-lg rounded-xl border-border-width border-surface-container-highest neo-shadow">
            <div class="w-24 h-24 bg-primary-container rounded-full border-4 border-black mb-md flex items-center justify-center neo-shadow">
                <span class="material-symbols-outlined text-5xl text-black">person</span>
            </div>
            <h2 class="font-headline-md text-primary uppercase" id="profile-name">Loading...</h2>
            <p class="font-label-bold text-on-surface-variant text-sm mt-xs">RANK: <span class="text-primary-container">NOVICE DROPPER</span></p>
            
            <div class="mt-lg pt-md border-t-border-width border-surface-container-highest space-y-sm">
                <div class="flex justify-between font-label-bold text-sm">
                    <span class="text-on-surface-variant">Drops Copped</span>
                    <span class="text-primary" id="profile-order-count">0</span>
                </div>
                <div class="flex justify-between font-label-bold text-sm">
                    <span class="text-on-surface-variant">Credits Spent</span>
                    <span class="text-primary" id="profile-spent">$0.00</span>
                </div>
            </div>
            
            <!-- Admin button (hidden by default) -->
            <button id="admin-panel-btn" onclick="window.location.href='/admin.html'" class="hidden w-full mt-lg bg-error text-on-error font-label-bold py-sm rounded-lg border-2 border-black neo-shadow active-neo-interaction flex justify-center items-center gap-xs">
                <span class="material-symbols-outlined text-sm">admin_panel_settings</span>
                THE WAR ROOM
            </button>
        </div>
    </div>
    
    <!-- Order History -->
    <div class="md:col-span-8 space-y-md">
        <h3 class="font-headline-md text-primary uppercase flex items-center gap-sm">
            <span class="material-symbols-outlined">receipt_long</span>
            Loot History
        </h3>
        <div id="orders-list" class="space-y-md">
            <!-- Populated by JS -->
            <div class="glass-panel p-xl rounded-xl border-border-width border-surface-container-highest text-center">
                <span class="material-symbols-outlined text-6xl text-surface-variant mb-md">inventory_2</span>
                <p class="font-label-bold text-on-surface-variant uppercase">No loot acquired yet.</p>
                <button onclick="window.location.href='/catalog.html'" class="mt-md bg-primary-container text-on-primary-container px-lg py-sm rounded border-2 border-black font-label-bold hover:-translate-y-1 transition-transform">BROWSE DROPS</button>
            </div>
        </div>
    </div>
</div>

</main>

<footer class="w-full py-xl px-lg flex flex-col md:flex-row justify-between items-center gap-md border-t-3 border-surface-variant bg-surface-dim mt-xl">
    <div class="flex flex-col gap-sm items-center md:items-start">
        <div class="font-headline-md text-headline-md text-secondary-fixed italic uppercase">DOPAMINE CLUB</div>
        <p class="font-body-md text-body-md text-on-surface-variant max-w-xs text-center md:text-left">
            ©2024 DOPAMINE CLUB / POP MART UNIVERSE
        </p>
    </div>
</footer>

<script src="/js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const token = localStorage.getItem('dopamine_token');
    if (!token) {
        window.location.href = '/auth.html';
        return;
    }
    
    try {
        const res = await fetch('/api/users/me', { headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) throw new Error('Failed to load profile');
        const user = await res.json();
        
        document.getElementById('profile-name').textContent = user.name;
        document.getElementById('profile-email').textContent = user.email;
        
        if (user.isAdmin) {
            document.getElementById('admin-panel-btn').classList.remove('hidden');
        }
        
        // Fetch orders
        const ordersRes = await fetch('/api/orders/my-orders', { headers: { 'Authorization': `Bearer ${token}` } });
        if (ordersRes.ok) {
            const orders = await ordersRes.json();
            document.getElementById('profile-order-count').textContent = orders.length;
            const totalSpent = orders.reduce((acc, o) => acc + o.totalPrice, 0);
            document.getElementById('profile-spent').textContent = `$${totalSpent.toFixed(2)}`;
            
            if (orders.length > 0) {
                document.getElementById('orders-list').innerHTML = orders.map(order => `
                    <div class="glass-panel p-md rounded-xl border-border-width border-surface-container-highest neo-shadow hover:scale-[1.01] transition-transform">
                        <div class="flex justify-between items-center border-b-border-width border-surface-container-highest pb-sm mb-sm">
                            <div>
                                <p class="font-label-bold text-on-surface-variant text-xs">ORDER #${order._id.substring(0,8).toUpperCase()}</p>
                                <p class="font-label-bold text-primary mt-1">${new Date(order.createdAt).toLocaleDateString()}</p>
                            </div>
                            <div class="text-right">
                                <span class="bg-primary-container text-on-primary-container px-sm py-[2px] rounded text-[10px] font-label-bold uppercase border border-black">${order.status}</span>
                                <p class="font-headline-md text-primary-fixed mt-1">$${order.totalPrice.toFixed(2)}</p>
                            </div>
                        </div>
                        <div class="flex -space-x-4">
                            ${order.orderItems.slice(0, 5).map(i => `
                                <div class="w-10 h-10 rounded border-2 border-surface-container-highest overflow-hidden">
                                    <img src="${i.images[0]}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=200'"/>
                                </div>
                            `).join('')}
                            ${order.orderItems.length > 5 ? `<div class="w-10 h-10 rounded border-2 border-surface-container-highest bg-surface-container-highest flex items-center justify-center font-label-bold text-xs">+${order.orderItems.length - 5}</div>` : ''}
                        </div>
                    </div>
                `).join('');
            }
        }
    } catch (err) {
        console.error(err);
        if(typeof showToast === 'function') showToast('Session expired. Please log in.', 'error');
        localStorage.removeItem('dopamine_token');
        setTimeout(() => window.location.href = '/auth.html', 1500);
    }
});

function logout() {
    localStorage.removeItem('dopamine_token');
    window.location.href = '/auth.html';
}
</script>
</body></html>
