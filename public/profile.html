<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PLAYER STATS | DOPAMINE CLUB</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;700&family=Space+Grotesk:wght@700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
  darkMode:"class",
  theme:{extend:{
    colors:{
      "background":"#14121f","surface":"#14121f","surface-container-lowest":"#0e0c1a",
      "surface-container-low":"#1c1a27","surface-container":"#201e2c","surface-container-high":"#2b2836",
      "surface-container-highest":"#363342","primary":"#ffffff","primary-fixed":"#c3f400",
      "primary-container":"#c3f400","on-primary-container":"#161e00","secondary-container":"#ff4b89",
      "on-surface":"#e5e0f3","on-surface-variant":"#c4c9ac","error":"#ffb4ab"
    },
    fontFamily:{"label-bold":["Space Grotesk"],"headline-md":["Syne"],"body-md":["Plus Jakarta Sans"],"headline-lg":["Syne"]},
    fontSize:{"label-bold":["14px",{lineHeight:"1.0",fontWeight:"700"}],"headline-md":["24px",{lineHeight:"1.3",fontWeight:"700"}],"headline-lg":["48px",{lineHeight:"1.2",fontWeight:"800"}],"body-md":["16px",{lineHeight:"1.6",fontWeight:"400"}]},
    spacing:{"xs":"4px","sm":"12px","md":"24px","lg":"48px","xl":"80px","border-width":"2px","base":"8px","3":"3px"}
  }}
};
</script>
<style>
  body { background: #14121f; color: #e5e0f3; font-family: 'Plus Jakarta Sans', sans-serif; }
  .neo-shadow { box-shadow: 6px 6px 0px #0D0B18; }
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-size:24px; font-style:normal; font-weight:normal; line-height:1; display:inline-block; white-space:nowrap; font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
</style>
</head>
<body class="bg-background text-on-surface min-h-screen overflow-x-hidden">

<!-- Navigation -->
<header class="sticky top-0 z-50 bg-surface/90 backdrop-blur-xl border-b-2 border-surface-container-highest">
  <nav class="flex justify-between items-center px-md py-sm max-w-7xl mx-auto">
    <a href="/" class="font-headline-md text-primary-container italic uppercase tracking-tighter">DOPAMINE CLUB</a>
    <div class="flex items-center gap-sm">
      <a href="/catalog" class="font-label-bold text-on-surface-variant hover:text-primary-container transition-colors text-sm">DROPS</a>
      <button data-cart-toggle class="relative flex items-center gap-xs font-label-bold bg-surface-container px-md py-xs rounded-full border-2 border-surface-container-highest hover:border-primary-container transition-colors">
        <span class="material-symbols-outlined text-lg">shopping_bag</span>
        <span data-cart-count class="absolute -top-1 -right-1 w-5 h-5 bg-secondary-container text-white text-[10px] font-bold rounded-full items-center justify-center hidden">0</span>
      </button>
    </div>
  </nav>
</header>

<main class="max-w-4xl mx-auto px-md py-lg">
  <h1 class="font-headline-lg text-primary mb-lg">PLAYER STATS</h1>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-md">
    <!-- Profile Card -->
    <div class="md:col-span-1">
      <div class="bg-surface-container-low border-2 border-surface-container-highest rounded-2xl p-lg text-center space-y-md">
        <!-- Avatar -->
        <div class="w-24 h-24 mx-auto rounded-full border-3 border-primary-container bg-surface-container-high flex items-center justify-center" style="box-shadow:4px 4px 0px #c3f400">
          <span class="material-symbols-outlined text-4xl text-primary-container" style="font-variation-settings:'FILL' 1">person</span>
        </div>
        <div>
          <h2 id="profile-username" class="font-headline-md text-primary">LOADING...</h2>
          <p id="profile-email" class="text-on-surface-variant text-sm mt-xs">...</p>
          <span id="profile-role" class="inline-block mt-sm font-label-bold text-xs px-sm py-xs bg-primary-container text-on-primary-container rounded border-2 border-black">MEMBER</span>
        </div>

        <!-- Quick Stats -->
        <div class="grid grid-cols-2 gap-sm">
          <div class="bg-surface-container-high rounded-xl p-sm text-center border-2 border-surface-container-highest">
            <div id="order-count" class="font-headline-md text-primary-container">0</div>
            <div class="text-on-surface-variant text-xs font-label-bold">Orders</div>
          </div>
          <div class="bg-surface-container-high rounded-xl p-sm text-center border-2 border-surface-container-highest">
            <div id="cart-count" class="font-headline-md text-primary-container">0</div>
            <div class="text-on-surface-variant text-xs font-label-bold">In Cart</div>
          </div>
        </div>

        <!-- Actions -->
        <div class="space-y-sm">
          <a href="/catalog" class="block w-full bg-primary-container text-on-primary-container font-label-bold py-sm rounded-lg border-2 border-black text-center hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-none transition-all" style="box-shadow:3px 3px 0px #000">SHOP DROPS</a>
          <button id="logout-btn" class="block w-full border-2 border-error text-error font-label-bold py-sm rounded-lg hover:bg-error hover:text-on-error transition-all">LOGOUT</button>
        </div>
      </div>
    </div>

    <!-- Order History -->
    <div class="md:col-span-2">
      <div class="bg-surface-container-low border-2 border-surface-container-highest rounded-2xl p-lg">
        <h3 class="font-headline-md text-primary mb-md">ORDER HISTORY</h3>
        <div id="order-history" class="space-y-sm">
          <!-- Populated by profile.js -->
          <div class="animate-pulse space-y-sm">
            <div class="h-16 bg-surface-container-high rounded-xl"></div>
            <div class="h-16 bg-surface-container-high rounded-xl"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="/js/shared_layout.js"></script>
<script src="/js/main.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
