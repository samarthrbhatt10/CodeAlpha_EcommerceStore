<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SYSTEM OVERRIDE | DOPAMINE CLUB</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;700&family=Space+Grotesk:wght@700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="/js/shared_layout.js"></script>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">

<header class="sticky top-md z-50 flex justify-between items-center px-md py-sm rounded-full border-border-width border-surface-container-highest mt-md mx-auto w-[95%] max-w-7xl bg-surface-container-low/20 backdrop-blur-xl shadow-offset-shadow transition-all duration-300">
<div class="font-headline-lg text-headline-lg-mobile italic uppercase tracking-tighter text-primary dark:text-primary-fixed cursor-pointer" onclick="window.location.href='/'">
    DOPAMINE CLUB
</div>
<nav class="hidden md:flex gap-md items-center">
    <a class="font-label-bold text-label-bold text-on-surface-variant hover:text-secondary-fixed-dim hover:scale-105 transition-transform" href="/catalog.html">DROPS</a>
    <a class="font-label-bold text-label-bold text-on-surface-variant hover:text-secondary-fixed-dim hover:scale-105 transition-transform" href="/catalog.html">VAULT</a>
</nav>
<div class="flex items-center gap-sm">
    <button onclick="window.location.href='/profile.html'" class="bg-surface-container text-on-surface font-label-bold text-label-bold px-md py-xs rounded-full border-border-width border-surface-container-highest hover:text-primary-container transition-all active:scale-95">BACK TO PROFILE</button>
</div>
</header>

<main class="pt-20 pb-xl px-md max-w-3xl mx-auto relative">
<div class="mb-lg border-b-border-width border-surface-container-highest pb-md text-center">
    <h1 class="font-display-xl text-[48px] uppercase tracking-tighter leading-none mb-sm text-primary">
        SYSTEM <span class="text-primary-fixed italic">OVERRIDE</span>
    </h1>
    <p class="text-on-surface-variant font-label-bold uppercase tracking-widest text-sm">Configure your link</p>
</div>

<div class="glass-panel p-lg rounded-xl border-border-width border-surface-container-highest neo-shadow">
    <form id="settings-form" class="space-y-lg">
        
        <div class="space-y-md">
            <h3 class="font-headline-md text-primary uppercase border-b border-surface-container-highest pb-xs">Identity Module</h3>
            
            <div>
                <label class="font-label-bold text-xs uppercase text-on-surface-variant mb-xs block">Handle (Name)</label>
                <input id="settings-name" required type="text" class="w-full bg-surface-container border-2 border-surface-container-highest rounded-lg px-md py-sm font-body-md text-on-surface focus:border-primary-container focus:outline-none transition-colors">
            </div>
            
            <div>
                <label class="font-label-bold text-xs uppercase text-on-surface-variant mb-xs block">Comm Link (Email) <span class="text-error ml-2">*Cannot be changed</span></label>
                <input id="settings-email" disabled type="email" class="w-full bg-surface-container-highest border-2 border-surface-container-highest rounded-lg px-md py-sm font-body-md text-on-surface-variant opacity-50 cursor-not-allowed">
            </div>
        </div>

        <div class="space-y-md pt-md">
            <h3 class="font-headline-md text-primary uppercase border-b border-surface-container-highest pb-xs">Security Protocol</h3>
            
            <div>
                <label class="font-label-bold text-xs uppercase text-on-surface-variant mb-xs block">Current Passcode</label>
                <input id="settings-current-password" type="password" class="w-full bg-surface-container border-2 border-surface-container-highest rounded-lg px-md py-sm font-body-md text-on-surface focus:border-primary-container focus:outline-none transition-colors">
            </div>
            
            <div>
                <label class="font-label-bold text-xs uppercase text-on-surface-variant mb-xs block">New Passcode</label>
                <input id="settings-new-password" type="password" placeholder="Leave blank to keep current" class="w-full bg-surface-container border-2 border-surface-container-highest rounded-lg px-md py-sm font-body-md text-on-surface focus:border-primary-container focus:outline-none transition-colors">
            </div>
        </div>

        <button type="submit" class="w-full bg-primary-container text-on-primary-container font-headline-md py-md rounded-xl border-border-width border-black neo-shadow active-neo-interaction mt-lg uppercase tracking-tight">
            APPLY OVERRIDE
        </button>
        <p id="settings-message" class="text-center font-label-bold text-sm hidden mt-sm"></p>
    </form>
</div>
</main>

<script src="/js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const token = localStorage.getItem('dopamine_token');
    if (!token) {
        window.location.href = '/auth.html';
        return;
    }
    
    try {
        const res = await fetch('/api/users/me', { headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) throw new Error('Failed to load profile');
        const user = await res.json();
        
        document.getElementById('settings-name').value = user.name;
        document.getElementById('settings-email').value = user.email;
    } catch (err) {
        window.location.href = '/auth.html';
    }
});

document.getElementById('settings-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const token = localStorage.getItem('dopamine_token');
    
    const name = document.getElementById('settings-name').value;
    const currentPassword = document.getElementById('settings-current-password').value;
    const newPassword = document.getElementById('settings-new-password').value;
    
    const msgEl = document.getElementById('settings-message');
    msgEl.classList.remove('hidden', 'text-[#c3f400]', 'text-error');
    
    try {
        const res = await fetch('/api/users/me', {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ name, currentPassword, newPassword })
        });
        
        const data = await res.json();
        
        if (res.ok) {
            msgEl.textContent = 'SYSTEM UPDATED SUCCESSFULLY';
            msgEl.classList.add('text-[#c3f400]');
            document.getElementById('settings-current-password').value = '';
            document.getElementById('settings-new-password').value = '';
            
            // Re-auth if password changed
            if (data.token) {
                localStorage.setItem('dopamine_token', data.token);
            }
        } else {
            msgEl.textContent = data.message || 'UPDATE FAILED';
            msgEl.classList.add('text-error');
        }
    } catch (err) {
        msgEl.textContent = 'NETWORK ERROR';
        msgEl.classList.add('text-error');
    }
});
</script>
</body></html>
