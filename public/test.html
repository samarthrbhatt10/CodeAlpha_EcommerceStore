<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
  @keyframes rainbow-border {
      0% { border-color: #ff4b89; box-shadow: 0 0 10px #ff4b89; }
      33% { border-color: #c3f400; box-shadow: 0 0 10px #c3f400; }
      66% { border-color: #00dbe9; box-shadow: 0 0 10px #00dbe9; }
      100% { border-color: #ff4b89; box-shadow: 0 0 10px #ff4b89; }
  }
  @keyframes holoFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
  }
  @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
  }
  @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
  }
  @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
  }
  .animate-float { animation: float 6s ease-in-out infinite; }
  .delay-75 { animation-delay: 0.75s; }
  .delay-500 { animation-delay: 2s; }
  .glitch-hover:hover { animation: glitch 0.2s cubic-bezier(.25, .46, .45, .94) both infinite; color: #ff4b89; }
  .neo-shadow { box-shadow: 6px 6px 0px #0D0B18; }
  .neo-shadow-sm { box-shadow: 4px 4px 0px #0D0B18; }
  .neo-shadow:hover { box-shadow: 2px 2px 0px #0D0B18; transform: translate(4px, 4px); }
  .neo-shadow:active { box-shadow: 0px 0px 0px #0D0B18; transform: translate(6px, 6px); }
  .outline-text {
      color: transparent;
      -webkit-text-stroke: 2px #e5e0f3;
  }
  .glass {
      background: rgba(32, 30, 44, 0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 4px solid #0D0B18;
      box-shadow: 6px 6px 0 #0D0B18;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .rare-glow:hover {
      box-shadow: 0 0 20px #abd600, 6px 6px 0 #0D0B18;
      border-color: #abd600;
  }
  .ultra-rare-glow:hover {
      box-shadow: 0 0 20px #ff4b89, 6px 6px 0 #0D0B18;
      border-color: #ff4b89;
  }
  .holographic-sticker {
      background: linear-gradient(45deg, #00dbe9, #ffb1c3, #abd600, #00dbe9);
      background-size: 300% 300%;
      animation: holoFlow 5s ease infinite;
      border: 2px solid white;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
  }
  .progress-stripe {
      background: repeating-linear-gradient(
          -45deg,
          transparent,
          transparent 10px,
          rgba(0, 0, 0, 0.1) 10px,
          rgba(0, 0, 0, 0.1) 20px
      );
  }
  .toggle-switch {
      width: 48px;
      height: 24px;
      background: #1c1a27;
      border: 2px solid #363342;
      position: relative;
      cursor: pointer;
      transition: all 0.2s;
  }
  .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: #8e9379;
      transition: all 0.2s;
  }
  .toggle-active .toggle-switch {
      background: #abd600;
      border-color: #0D0B18;
  }
  .toggle-active .toggle-switch::after {
      left: 26px;
      background: #0D0B18;
  }
  .glass-card:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 #abd600; }
  .glass-card:active { transform: translate(4px, 4px); box-shadow: 0 0 0 #0D0B18; }
  .glass-panel {
      background: rgba(32, 30, 44, 0.7);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
  }
  .holographic-sticker, .holographic-glow, .holographic {
      background: linear-gradient(45deg, rgba(0, 219, 233, 0.8), rgba(255, 75, 137, 0.8), rgba(195, 244, 0, 0.8));
      background-size: 300% 300%;
      animation: holoFlow 5s ease infinite;
  }
  .holographic-sticker { border: 4px solid white; box-shadow: 2px 2px 10px rgba(0,0,0,0.2); transform: rotate(-5deg); }
  .grainy-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999;
      opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; display: inline-block; white-space: nowrap; }
  
  #toast-container .opacity-100 { pointer-events:auto; }
  html, body { max-width: 100vw; overflow-x: hidden; }
