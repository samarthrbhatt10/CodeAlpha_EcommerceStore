<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  </style>
</head>
<body>
  <div id="threejs-container-unboxing" class="w-full h-full"></div>
  <script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
  <script>
    (function() {
      const container = document.getElementById('threejs-container-unboxing');
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      // Mystery Box Group
      const boxGroup = new THREE.Group();
      scene.add(boxGroup);

      // Core Box (Outer Shell)
      const outerGeo = new THREE.BoxGeometry(2, 2, 2);
      const outerMat = new THREE.MeshPhongMaterial({ color: 0x3a3746, wireframe: true, transparent: true, opacity: 0.8 });
      const outerBox = new THREE.Mesh(outerGeo, outerMat);
      boxGroup.add(outerBox);

      // Inner Core (Glowing)
      const innerGeo = new THREE.IcosahedronGeometry(0.8, 0);
      const innerMat = new THREE.MeshStandardMaterial({ 
        color: 0xccff00, 
        emissive: 0xccff00, 
        emissiveIntensity: 2,
        flatShading: true
      });
      const core = new THREE.Mesh(innerGeo, innerMat);
      boxGroup.add(core);

      // Data Rings
      const ringGeo = new THREE.TorusGeometry(1.5, 0.02, 16, 100);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0xff00ff });
      const ring1 = new THREE.Mesh(ringGeo, ringMat);
      const ring2 = new THREE.Mesh(ringGeo, ringMat);
      ring2.rotation.x = Math.PI / 2;
      boxGroup.add(ring1);
      boxGroup.add(ring2);

      scene.add(new THREE.AmbientLight(0x404040, 2));
      const light = new THREE.PointLight(0xffffff, 2);
      light.position.set(5, 5, 5);
      scene.add(light);

      camera.position.z = 5;

      function animate() {
        requestAnimationFrame(animate);
        boxGroup.rotation.y += 0.01;
        boxGroup.rotation.x += 0.005;
        core.rotation.z -= 0.02;
        core.scale.setScalar(1 + Math.sin(Date.now() * 0.003) * 0.1);
        ring1.rotation.z += 0.05;
        ring2.rotation.y -= 0.05;
        renderer.render(scene, camera);
      }

      window.addEventListener('resize', () => {
        renderer.setSize(container.clientWidth, container.clientHeight);
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
      });

      animate();
    })();
  </script>
</body>
</html>
