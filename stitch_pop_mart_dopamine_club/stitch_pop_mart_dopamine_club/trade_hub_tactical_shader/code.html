<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    </style>
</head>
<body>
    <div class="fixed inset-0 w-full h-full">
        <canvas id="shader-canvas-TRADE_GRID" style="display:block;width:100%;height:100%"></canvas>
        <script>
        (function() {
            const canvas = document.getElementById('shader-canvas-TRADE_GRID');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (!gl) return;

            function syncSize() {
                const w = canvas.clientWidth || 1280;
                const h = canvas.clientHeight || 720;
                if (canvas.width !== w || canvas.height !== h) {
                    canvas.width = w;
                    canvas.height = h;
                }
            }
            window.addEventListener('resize', syncSize);
            syncSize();

            const vs = `attribute vec2 a_position;
            varying vec2 v_texCoord;
            void main() {
                v_texCoord = a_position * 0.5 + 0.5;
                gl_Position = vec4(a_position, 0.0, 1.0);
            }`;

            const fs = `precision highp float;
            varying vec2 v_texCoord;
            uniform float u_time;
            uniform vec2 u_resolution;

            float random(vec2 st) {
                return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
            }

            void main() {
                vec2 uv = v_texCoord;
                vec2 st = (uv - 0.5) * 2.0;
                st.x *= u_resolution.x / u_resolution.y;
                
                // Tech grid with movement
                vec2 grid = fract(uv * 20.0 + vec2(u_time * 0.05, u_time * 0.02));
                float line = step(0.98, grid.x) + step(0.98, grid.y);
                
                // Data pulses
                float pulse = smoothstep(0.4, 0.5, sin(u_time * 0.5 + length(st) * 2.0)) * 0.1;
                
                // Scan bar
                float bar = step(0.99, fract(uv.y - u_time * 0.1));
                
                vec3 lime = vec3(0.8, 1.0, 0.0);
                vec3 dark = vec3(0.04, 0.04, 0.08);
                
                vec3 color = mix(dark, lime, line * 0.15);
                color += lime * bar * 0.3;
                color += lime * pulse;
                
                // Glitch noise
                float n = random(vec2(floor(uv.y * 200.0), floor(u_time * 30.0)));
                color += lime * step(0.99, n) * 0.1;
                
                gl_FragColor = vec4(color, 1.0);
            }`;

            function cs(type, src) {
                const s = gl.createShader(type);
                gl.shaderSource(s, src);
                gl.compileShader(s);
                return s;
            }

            const prog = gl.createProgram();
            gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
            gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
            gl.linkProgram(prog);
            gl.useProgram(prog);

            const buf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
            const pos = gl.getAttribLocation(prog, 'a_position');
            gl.enableVertexAttribArray(pos);
            gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

            const uTime = gl.getUniformLocation(prog, 'u_time');
            const uRes = gl.getUniformLocation(prog, 'u_resolution');

            function render(t) {
                gl.viewport(0, 0, canvas.width, canvas.height);
                gl.uniform1f(uTime, t * 0.001);
                gl.uniform2f(uRes, canvas.width, canvas.height);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                requestAnimationFrame(render);
            }
            render(0);
        })();
        </script>
    </div>
</body>
</html>
